project_id = "event-platform"

[api]
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[auth.external.google]
enabled = false
# Set in the Supabase dashboard (Authentication > Providers > Google)
# or via local env vars SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID / _SECRET.
